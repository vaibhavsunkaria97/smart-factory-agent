<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <rect width="900" height="700" fill="#ffffff"/>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════
       STAGE 0 — Data source
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="245" y="20" width="410" height="50" rx="4" ry="4"
        style="fill:#f8fafc; stroke:#334155; stroke-width:1.2"/>
  <text x="450" y="41" style="fill:#0f172a; font-family:monospace; font-size:13px; text-anchor:middle; font-weight:bold">
    sensor_data.csv
  </text>
  <text x="450" y="58" style="fill:#475569; font-family:sans-serif; font-size:10px; text-anchor:middle">
    timestamp · temp · pressure · vibration · label
  </text>

  <!-- arrow 0→1 -->
  <line x1="450" y1="70" x2="450" y2="104" style="stroke:#1e293b; stroke-width:1.2" marker-end="url(#ah)"/>

  <!-- ═══════════════════════════════════════════════════════════════
       STAGE 1 — Preprocessing
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="195" y="108" width="510" height="52" rx="4" ry="4"
        style="fill:#ffffff; stroke:#334155; stroke-width:1.2"/>
  <text x="450" y="130" style="fill:#0f172a; font-family:sans-serif; font-size:12px; font-weight:bold; text-anchor:middle">
    1. Preprocessing
  </text>
  <text x="450" y="148" style="fill:#475569; font-family:sans-serif; font-size:10.5px; text-anchor:middle">
    Dedup → time-aware imputation → z-score standardisation
  </text>

  <!-- arrow 1→2 -->
  <line x1="450" y1="160" x2="450" y2="194" style="stroke:#1e293b; stroke-width:1.2" marker-end="url(#ah)"/>

  <!-- ═══════════════════════════════════════════════════════════════
       STAGE 2 — Detection Ensemble
       ═══════════════════════════════════════════════════════════════ -->
  <!-- outer frame -->
  <rect x="110" y="198" width="680" height="192" rx="4" ry="4"
        style="fill:#ffffff; stroke:#334155; stroke-width:1.2"/>
  <text x="450" y="220" style="fill:#0f172a; font-family:sans-serif; font-size:12px; font-weight:bold; text-anchor:middle">
    2. Detection Ensemble
  </text>

  <!-- left: rule-based -->
  <rect x="140" y="234" width="280" height="58" rx="3" ry="3"
        style="fill:#f1f5f9; stroke:#64748b; stroke-width:1"/>
  <text x="280" y="256" style="fill:#0f172a; font-family:sans-serif; font-size:11.5px; font-weight:bold; text-anchor:middle">
    Rule-based detector
  </text>
  <text x="280" y="274" style="fill:#475569; font-family:sans-serif; font-size:10px; text-anchor:middle">
    Physical thresholds · explainable
  </text>

  <!-- right: IsolationForest -->
  <rect x="480" y="234" width="280" height="58" rx="3" ry="3"
        style="fill:#f1f5f9; stroke:#64748b; stroke-width:1"/>
  <text x="620" y="256" style="fill:#0f172a; font-family:sans-serif; font-size:11.5px; font-weight:bold; text-anchor:middle">
    Isolation Forest
  </text>
  <text x="620" y="274" style="fill:#475569; font-family:sans-serif; font-size:10px; text-anchor:middle">
    Unsupervised ML · multivariate
  </text>

  <!-- converging arrows -->
  <line x1="280" y1="292" x2="355" y2="332" style="stroke:#1e293b; stroke-width:1.1" marker-end="url(#ah)"/>
  <line x1="620" y1="292" x2="545" y2="332" style="stroke:#1e293b; stroke-width:1.1" marker-end="url(#ah)"/>

  <!-- fused score -->
  <rect x="265" y="334" width="370" height="42" rx="3" ry="3"
        style="fill:#f1f5f9; stroke:#64748b; stroke-width:1"/>
  <text x="450" y="352" style="fill:#0f172a; font-family:sans-serif; font-size:11px; font-weight:bold; text-anchor:middle">
    Fused score + severity
  </text>
  <text x="450" y="368" style="fill:#475569; font-family:sans-serif; font-size:9.5px; text-anchor:middle">
    LOW · MEDIUM · HIGH · CRITICAL
  </text>

  <!-- arrow 2→3 -->
  <line x1="450" y1="390" x2="450" y2="430" style="stroke:#1e293b; stroke-width:1.2" marker-end="url(#ah)"/>

  <!-- ═══════════════════════════════════════════════════════════════
       STAGE 3 — Reasoning
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="110" y="434" width="680" height="118" rx="4" ry="4"
        style="fill:#ffffff; stroke:#334155; stroke-width:1.2"/>
  <text x="450" y="456" style="fill:#0f172a; font-family:sans-serif; font-size:12px; font-weight:bold; text-anchor:middle">
    3. Reasoning
  </text>

  <!-- three backends -->
  <rect x="135" y="468" width="186" height="42" rx="3" ry="3"
        style="fill:#f1f5f9; stroke:#64748b; stroke-width:1"/>
  <text x="228" y="486" style="fill:#0f172a; font-family:sans-serif; font-size:11px; font-weight:bold; text-anchor:middle">
    Ollama
  </text>
  <text x="228" y="502" style="fill:#475569; font-family:sans-serif; font-size:9.5px; text-anchor:middle">
    local · offline
  </text>

  <rect x="357" y="468" width="186" height="42" rx="3" ry="3"
        style="fill:#f1f5f9; stroke:#64748b; stroke-width:1"/>
  <text x="450" y="486" style="fill:#0f172a; font-family:sans-serif; font-size:11px; font-weight:bold; text-anchor:middle">
    Groq
  </text>
  <text x="450" y="502" style="fill:#475569; font-family:sans-serif; font-size:9.5px; text-anchor:middle">
    free tier · hosted
  </text>

  <rect x="579" y="468" width="186" height="42" rx="3" ry="3"
        style="fill:#f1f5f9; stroke:#64748b; stroke-width:1"/>
  <text x="672" y="486" style="fill:#0f172a; font-family:sans-serif; font-size:11px; font-weight:bold; text-anchor:middle">
    Offline expert reasoner
  </text>
  <text x="672" y="502" style="fill:#475569; font-family:sans-serif; font-size:9.5px; text-anchor:middle">
    no API key needed
  </text>

  <!-- graceful-degradation arrows between backends -->
  <line x1="321" y1="489" x2="353" y2="489" style="stroke:#94a3b8; stroke-width:1; stroke-dasharray:4,3" marker-end="url(#ah)"/>
  <line x1="543" y1="489" x2="575" y2="489" style="stroke:#94a3b8; stroke-width:1; stroke-dasharray:4,3" marker-end="url(#ah)"/>

  <!-- note -->
  <text x="450" y="536" style="fill:#64748b; font-family:sans-serif; font-size:9.5px; font-style:italic; text-anchor:middle">
    graceful degradation: Ollama → Groq → deterministic fallback
  </text>

  <!-- arrow 3→4 -->
  <line x1="450" y1="552" x2="450" y2="590" style="stroke:#1e293b; stroke-width:1.2" marker-end="url(#ah)"/>

  <!-- ═══════════════════════════════════════════════════════════════
       STAGE 4 — Alerting
       ═══════════════════════════════════════════════════════════════ -->
  <rect x="195" y="594" width="510" height="52" rx="4" ry="4"
        style="fill:#ffffff; stroke:#334155; stroke-width:1.2"/>
  <text x="450" y="616" style="fill:#0f172a; font-family:sans-serif; font-size:12px; font-weight:bold; text-anchor:middle">
    4. Alerting
  </text>
  <text x="450" y="634" style="fill:#475569; font-family:sans-serif; font-size:10.5px; text-anchor:middle">
    Rich CLI table + alerts.json for MES / dashboards
  </text>

  <!-- vertical "PIPELINE" label -->
  <text x="70" y="370" style="fill:#94a3b8; font-family:sans-serif; font-size:10px; letter-spacing:4px; text-anchor:middle"
        transform="rotate(-90 70 370)">
    PIPELINE
  </text>

  <!-- figure caption -->
  <text x="450" y="682" style="fill:#64748b; font-family:sans-serif; font-size:10px; text-anchor:middle; font-style:italic">
    Fig. 1 — Smart Factory Agent processing pipeline
  </text>
</svg>
